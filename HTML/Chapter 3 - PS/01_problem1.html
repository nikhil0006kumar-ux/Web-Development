<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato - Food delivey at your doorstep</title>
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body */
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #fff5f5;
            color: #333;
        }

        /* Header */
        header {
            background-color: #e23744;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 60px;
        }

        /* Logo */
        header div:first-child {
            font-size: 32px;
            font-weight: bold;
        }

        /* Navigation */
        header div:last-child a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 18px;
            transition: 0.3s;
        }

        header div:last-child a:hover {
            color: #ffd6d6;
        }

        /* Main Section */
        main {
            text-align: center;
            padding: 120px 20px;
        }

        /* Heading */
        main div {
            font-size: 42px;
            font-weight: bold;
            color: #e23744;
            margin-bottom: 20px;
        }

        /* Paragraph */
        main p {
            font-size: 20px;
            color: #555;
            max-width: 700px;
            margin: auto;
            line-height: 1.6;
        }

        /* Footer */
        footer {
            background-color: #e23744;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 80px;
        }
    </style>
</head>

<body>
    <header>
        <div>Zomato</div>
        <div>
            <a href="/home">Home</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
        </div>
    </header>
    <main>

        <div>
            Order food any time anywhere
        </div>
        <p>
            Our app is packed with features that enable you to experience food delivery like never before
        </p>
    </main>
    <footer>
        Copyright Zomato all rights reserved
    </footer>
</body>

</html>
