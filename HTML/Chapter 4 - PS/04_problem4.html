<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        table {
            width: 650px;
            border-collapse: collapse;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        thead {
            background: #0077b6;
            color: white;
        }

        th {
            padding: 18px;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            padding: 16px;
            text-align: center;
            font-size: 18px;
            border-bottom: 1px solid #ddd;
        }

        tbody tr:nth-child(even) {
            background: #f4f4f4;
        }

        tbody tr:hover {
            background: #caf0f8;
            transform: scale(1.01);
            transition: 0.3s;
            cursor: pointer;
        }

        td:first-child {
            font-weight: bold;
            color: #023e8a;
        }
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Score</th>
                <th>Match/th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Virat Kohli</td>
                <td>34</td>
                <td>IPL 2024</td>
            </tr>
            <tr>
                <td>Rohit Sharma</td>
                <td>74</td>
                <td>IPL 2024</td>
            </tr>
            <tr>
                <td>Manish Pandey </td>
                <td>54</td>
                <td>IPL 2023</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
