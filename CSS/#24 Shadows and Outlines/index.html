<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 5px #2bce1c;
        }
        .text-element {
            text-shadow: 10px 5px 3px #a51fb9;
        }
    </style>
</head>

<body>
    <div class="box">
        I am a box
    </div>
    <p class="text-element">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Magni ut aut incidunt quis non rem quia accusantium,
        autem molestiae neque nisi deserunt sapiente sequi nulla exercitationem illo modi. Autem voluptatem labore qui
        debitis magni.
    </p>
</body>

</html>
